<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <title>Sign-Up Form</title>
            <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/troika">
            <link rel="stylesheet" href="style.css">
        </head>
        <body>
            <div class="container">
                <aside class="left-side">
                    <h1>Mucsi</h1>
                    <p class="credit">Photo by <a href="https://unsplash.com/@vaccinium">Dimitrii Vaccinium</a> 
                        on <a href="https://unsplash.com/">Unsplash</a>.</p>
                    <img src="./images/Bicycle.jpg">
                </aside>
                <div class="right-side">
                    <header>
                        <h2>
                            This is not a real online service! You know you need something
                            like this in your life to help you realize your deepest dreams.
                            Sign up <i>now</i> to get started.
                        </h2>
                        <p>You <i>know</i> you want to.</p>
                    </header>
                    <form id="Sign-Up-Form" method="post">
                        <h2>Let's do this!</h2>
                        <p>Please complete all required (*) fields.</p>
                        <div class="form-grid">
                            <div class="form-row">
                                <label for="first-name">FIRST NAME *</label>
                                    <input type="text" 
                                            id="first-name" 
                                            name="first-name" 
                                            placeholder="JOHN" required />
                            </div>
                            <div class="form-row">
                                <label for="last-name">LAST NAME *</label>
                                    <input type="text" 
                                           id="last-name" 
                                           name="last-name" 
                                           placeholder="DOE" required />
                            </div>
                            <div class="form-row">
                                <label for="email">EMAIL * </label>
                                    <input type="email" 
                                            id="email" 
                                            name="email" 
                                            placeholder="abc@example.com" required />
                            </div>
                            <div class="form-row">
                                <label for="phone-number">PHONE NUMBER </label>
                                    <input type="number" 
                                           id="phone-number" 
                                           name="phone-number"
                                           placeholder="062/12-34-567" />
                            </div>
                            <div class="form-row">
                                <label for="password">PASSWORD * </label> 
                                    <input type="password" id="password" name="password" required />
                            </div>
                            <div class="form-row">
                                <label for="confirm-password">CONFIRM PASSWORD *</label>
                                    <input type="password"
                                           id="confirm-password"
                                           name="confirm-password"
                                           required />
                            </div>
                        </div>
                    </form>
                    <footer>
                        <button type="submit" form="Sign-Up-Form">Create Account</button>
                    </footer>
                </div>
            </div>
        </body>
    </html>
